<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9f0e8">
    <title>Bağlantı yok · Ev Hesap</title>
    <style>
      :root { color-scheme: light; font-family: "Mada", "Segoe UI", sans-serif; background: #e9f0e8; color: #202a2b; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); padding: 28px 0; border-top: 2px solid #202a2b; border-bottom: 1px solid #a6b5aa; }
      img { width: 52px; height: 52px; margin-bottom: 30px; }
      h1 { max-width: 10ch; margin: 0 0 12px; font-family: "Yantramanav", "Segoe UI", sans-serif; font-size: clamp(38px, 11vw, 56px); line-height: 0.98; letter-spacing: -0.03em; }
      p { max-width: 38ch; margin: 0 0 24px; color: #465754; font-size: 17px; line-height: 1.5; }
      button { min-height: 46px; padding: 0 16px; border: 1px solid #d86436; border-radius: 4px; background: #d86436; color: #202a2b; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 2px solid #202a2b; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="">
      <h1>Bağlantı kurulamadı.</h1>
      <p>Ev Hesap verileri güncel olarak göstermek için internet bağlantısı ister. Bağlantı geldiğinde yeniden deneyebilirsin.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
